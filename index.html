<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>回数券の残り回数ノート（デモ）</title>
<style>
:root{--bg:#fafaf7;--fg:#222;--mut:#666;--line:#ddd;--card:#fff;--warn:#fff1cc;--warnfg:#7a5200;--bad:#ffe0e0;--badfg:#9b1c1c;--done:#eee;--ok:#e3f4e8;--okfg:#1d6b3a;--ac:#2f6f6a}
@media(prefers-color-scheme:dark){:root{--bg:#1b1c1b;--fg:#eee;--mut:#aaa;--line:#444;--card:#262726;--warn:#4a3a10;--warnfg:#ffd77a;--bad:#4d1f1f;--badfg:#ffb4b4;--done:#333;--ok:#1e3a29;--okfg:#9fe0b4;--ac:#6cc3bb}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Hiragino Sans",sans-serif;padding:16px}
main{max-width:920px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
input,select,button{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);min-height:36px}
button{cursor:pointer}button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.4;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin:10px 0}
.card label{display:inline-flex;flex-direction:column;font-size:12px;color:var(--mut);margin:0 8px 6px 0}
.sum{font-size:13px;color:var(--mut)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;background:var(--card)}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--mut)}th.s{cursor:pointer;text-decoration:underline dotted}
td.n{text-align:right}
tr.warn{background:var(--warn)}tr.bad{background:var(--bad)}tr.done{background:var(--done);color:var(--mut)}
.tag{display:inline-block;padding:0 8px;border-radius:10px;font-size:12px}
.tag.warn{background:var(--warn);color:var(--warnfg)}.tag.bad{background:var(--bad);color:var(--badfg)}.tag.done{background:var(--done)}.tag.ok{background:var(--ok);color:var(--okfg)}
#err{display:none;border:1px solid var(--badfg);background:var(--bad);color:var(--badfg);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:13px}
#err code{display:block;white-space:pre-wrap;word-break:break-all}
.log{font-size:12px;color:var(--mut)}
footer{font-size:12px;color:var(--mut);margin-top:16px}
</style></head><body><main>
<h1>回数券の残り回数ノート</h1>
<p class="sub">会員ごとの回数券を一覧にして、「1回消化」を押すと日付つきで残り回数が減ります。データはこのブラウザの中だけに保存され、どこにも送信されません。</p>

<div class="card" id="add">
<label>名前<input id="fn" maxlength="40" placeholder="例：サンプル 花子"></label>
<label>購入日<input id="fb" type="date"></label>
<label>総回数<input id="ft" type="number" min="1" step="1" value="5" style="width:80px"></label>
<label>期限（空でもOK）<input id="fe" type="date"></label>
<button class="pri" id="addb">追加</button> <span id="addm" class="sum"></span>
</div>

<div class="bar">
<input id="q" type="search" placeholder="名前で検索" aria-label="検索">
<select id="sort" aria-label="並べ替え">
<option value="expiry">期限が近い順</option><option value="remain">残りが少ない順</option><option value="name">名前順</option><option value="bought">購入日が新しい順</option>
</select>
<button id="exp">CSV書き出し</button>
<button id="imp">CSV読み込み</button><input id="file" type="file" accept=".csv,text/csv,text/plain" hidden>
<button id="smp">サンプルに戻す</button>
<button id="clr">全部消す</button>
</div>
<p class="sum" id="sum"></p>
<div id="err" role="alert"></div>
<div class="tw"><table><thead><tr>
<th class="s" data-s="name">名前</th><th>購入日</th><th>総回数</th><th class="s" data-s="remain">残り</th><th class="s" data-s="expiry">期限</th><th>状態</th><th>操作</th><th>消化の記録</th>
</tr></thead><tbody id="tb"></tbody></table></div>
<footer>色だけでなく「状態」の文字でも表示します（期限の14日前から「期限が近い」、残り2回以下で「残り少」）。表示は目安で、最終確認はご自身で行ってください。入力・CSVは画面内で処理するだけで外部へ送りません。Claude Codeで作成（七海）。</footer>
</main>
<script>
/* ---- CALC-START（verify.mjs がこの範囲を取り出して検算する） */
const DAY = 86400000;
function parseDate(s) { // YYYY-MM-DD / YYYY/M/D / YYYY年M月D日 → 'YYYY-MM-DD'。不正なら null
  s = String(s ?? '').trim().replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  const m = s.match(/^(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})日?$/); if (!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3], t = new Date(Date.UTC(y, mo - 1, d));
  if (t.getUTCFullYear() !== y || t.getUTCMonth() !== mo - 1 || t.getUTCDate() !== d) return null;
  return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
const dnum = s => Date.parse(s + 'T00:00:00Z') / DAY;
function toInt(s) { s = String(s ?? '').trim().replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)); return /^\d{1,4}$/.test(s) ? +s : null; }
function parseCSV(text) { // 引用符・改行入りセル・BOM・CRLF対応。行の配列を返す
  text = text.replace(/^﻿/, ''); const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"' && cell === '') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
const HEAD = ['名前', '購入日', '総回数', '残り回数', '期限', '消化日'];
function toCSV(list) {
  const e = v => /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  return '﻿' + [HEAD, ...list.map(t => [t.name, t.bought, t.total, t.remain, t.expiry, t.log.join(';')])].map(r => r.map(e).join(',')).join('\r\n') + '\r\n';
}
function parseRow(r) { // → {ok:ticket} か {err:理由}
  const name = (r[0] ?? '').trim(); if (!name) return { err: '名前が空です' };
  const bought = parseDate(r[1]); if (!bought) return { err: '購入日が読めません' };
  const total = toInt(r[2]); if (!total) return { err: '総回数が読めません（1以上の整数）' };
  const remain = toInt(r[3]); if (remain === null) return { err: '残り回数が読めません（0以上の整数）' };
  if (remain > total) return { err: '残り回数が総回数より多いです' };
  let expiry = ''; if ((r[4] ?? '').trim() !== '') { expiry = parseDate(r[4]); if (!expiry) return { err: '期限が読めません' }; if (dnum(expiry) < dnum(bought)) return { err: '期限が購入日より前です' }; }
  const log = []; for (const x of (r[5] ?? '').split(/[;；]/).map(s => s.trim()).filter(Boolean)) { const d = parseDate(x); if (!d) return { err: '消化日が読めません: ' + x }; log.push(d); }
  return { ok: { name, bought, total, remain, expiry, log } };
}
function importCSV(text) { // 先頭行が見出し（名前…）なら読み飛ばす
  const rows = parseCSV(text), ok = [], errs = [];
  rows.forEach((r, i) => { if (i === 0 && r[0].trim() === '名前') return; const p = parseRow(r); if (p.ok) ok.push(p.ok); else errs.push({ line: i + 1, why: p.err, raw: r.join(',') }); });
  return { ok, errs };
}
function consume(t, today) { if (t.remain < 1) return false; t.remain--; t.log.push(today); return true; }
function undo(t) { if (!t.log.length || t.remain >= t.total) return false; t.remain++; t.log.pop(); return true; }
function status(t, today, warnDays = 14, lowN = 2) { // 優先順：使い切り > 期限切れ > 期限が近い > 残り少
  if (t.remain === 0) return 'done';
  if (t.expiry) { const left = dnum(t.expiry) - dnum(today); if (left < 0) return 'expired'; if (left <= warnDays) return 'soon'; }
  return t.remain <= lowN ? 'low' : 'ok';
}
function sortList(list, key) {
  const c = { name: (a, b) => a.name.localeCompare(b.name, 'ja'), remain: (a, b) => a.remain - b.remain || a.name.localeCompare(b.name, 'ja'),
    expiry: (a, b) => (a.expiry || '9999') < (b.expiry || '9999') ? -1 : (a.expiry || '9999') > (b.expiry || '9999') ? 1 : 0, bought: (a, b) => a.bought < b.bought ? 1 : a.bought > b.bought ? -1 : 0 }[key];
  return list.slice().sort(c);
}
/* ---- CALC-END */

const KEY = 'ticketTrackerDemo.v1', $ = id => document.getElementById(id);
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const SAMPLE = [ // すべて架空
  ['サンプル 花子', -40, 5, 2, 50], ['サンプル 太郎', -10, 10, 9, 170], ['サンプル 月子', -170, 5, 3, 10], ['サンプル 光', -200, 5, 1, -20], ['サンプル 空', -60, 3, 0, 120], ['サンプル 星', -5, 5, 5, 175]
];
function sample() { const base = dnum(todayStr()), f = n => new Date((base + n) * DAY).toISOString().slice(0, 10);
  return SAMPLE.map(([name, b, total, remain, e]) => ({ name, bought: f(b), total, remain, expiry: f(e), log: Array.from({ length: total - remain }, (_, i) => f(b + 3 + i * 7)) })); }
let tickets, errs = [], sortKey = 'expiry';
try { tickets = JSON.parse(localStorage.getItem(KEY)); } catch (e) { tickets = null; }
if (!Array.isArray(tickets)) tickets = sample();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(tickets)); } catch (e) { /* 保存できない環境では画面内だけで動く */ } };
const LABEL = { done: ['使い切り', 'done'], expired: ['期限切れ', 'bad'], soon: ['期限が近い', 'warn'], low: ['残り少', 'warn'], ok: ['', 'ok'] };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function render() {
  const today = todayStr(), q = $('q').value.trim().toLowerCase();
  const list = sortList(tickets, sortKey).filter(t => !q || t.name.toLowerCase().includes(q));
  const cnt = { expired: 0, soon: 0, low: 0, done: 0 };
  tickets.forEach(t => { const s = status(t, today); if (s in cnt) cnt[s]++; });
  $('sum').textContent = `会員${tickets.length}件｜期限切れ${cnt.expired}・期限が近い${cnt.soon}・残り少${cnt.low}・使い切り${cnt.done}（今日：${today}）`;
  $('tb').innerHTML = list.map(t => { const s = status(t, today), [lab, cls] = LABEL[s], i = tickets.indexOf(t);
    const rowCls = s === 'expired' ? 'bad' : s === 'soon' || s === 'low' ? 'warn' : s === 'done' ? 'done' : '';
    return `<tr class="${rowCls}"><td>${esc(t.name)}</td><td>${t.bought}</td><td class="n">${t.total}</td><td class="n"><b>${t.remain}</b></td><td>${t.expiry || '—'}</td>
<td>${lab ? `<span class="tag ${cls}">${lab}</span>` : ''}</td>
<td><button data-use="${i}" ${t.remain < 1 ? 'disabled' : ''}>1回消化</button> <button data-undo="${i}" ${t.log.length ? '' : 'disabled'} title="直前の消化を取り消す">戻す</button> <button data-del="${i}" title="この会員を削除">削除</button></td>
<td class="log">${esc(t.log.slice(-3).join(' / '))}${t.log.length > 3 ? ' …' : ''}</td></tr>`; }).join('') || '<tr><td colspan="8">該当なし</td></tr>';
  const e = $('err'); e.style.display = errs.length ? 'block' : 'none';
  e.innerHTML = errs.length ? `<b>読めなかった行が${errs.length}件あります（取り込んでいません）</b>` + errs.map(x => `<code>${x.line}行目：${esc(x.why)}　→ ${esc(x.raw)}</code>`).join('') : '';
}
$('tb').addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.use) consume(tickets[d.use], todayStr()); else if (d.undo) undo(tickets[d.undo]);
  else if (d.del && confirm(tickets[d.del].name + ' を削除しますか？')) tickets.splice(+d.del, 1); else if (d.del) return;
  save(); render(); });
$('addb').onclick = () => { const r = [$('fn').value, $('fb').value || todayStr(), $('ft').value, $('ft').value, $('fe').value], p = parseRow(r);
  if (!p.ok) { $('addm').textContent = p.err; return; } tickets.push(p.ok); $('addm').textContent = ''; $('fn').value = ''; save(); render(); };
$('q').oninput = render; $('sort').onchange = e => { sortKey = e.target.value; render(); };
document.querySelectorAll('th.s').forEach(th => th.onclick = () => { sortKey = th.dataset.s; $('sort').value = sortKey; render(); });
$('exp').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([toCSV(tickets)], { type: 'text/csv;charset=utf-8' })); a.download = 'tickets.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };
$('imp').onclick = () => $('file').click();
$('file').onchange = async e => { const f = e.target.files[0]; if (!f) return; const r = importCSV(await f.text()); tickets = r.ok; errs = r.errs; e.target.value = ''; save(); render(); };
$('smp').onclick = () => { tickets = sample(); errs = []; save(); render(); };
$('clr').onclick = () => { if (confirm('表の内容をすべて消します。先にCSV書き出しをおすすめします。よろしいですか？')) { tickets = []; errs = []; save(); render(); } };
render();
</script></body></html>
